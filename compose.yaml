name: ethos

services:
  app:
    build:
      context: .
      target: runtime
    image: ethos:local
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://ethos:ethos@postgres:5432/ethos
      DATABASE_SSL: "false"
      APP_VERSION: local
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [ethos]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ethos
      POSTGRES_USER: ethos
      POSTGRES_PASSWORD: ethos
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethos -d ethos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [ethos]

  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks: [ethos]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [ethos]

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  ethos:
    driver: bridge
