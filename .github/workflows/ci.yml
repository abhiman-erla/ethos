name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets-scan:
    uses: abhiman-erla/ci-templates/.github/workflows/secret-scan.yml@38dc8c6d2b578d7ad8ded1467c464118dc0e1dc1 # v1.3.0

  workflow-lint:
    uses: abhiman-erla/ci-templates/.github/workflows/workflow-lint.yml@38dc8c6d2b578d7ad8ded1467c464118dc0e1dc1 # v1.3.0

  node:
    uses: abhiman-erla/ci-templates/.github/workflows/node-ci.yml@38dc8c6d2b578d7ad8ded1467c464118dc0e1dc1 # v1.3.0
    with:
      # engines says >=22 and the Dockerfile runs node:22.
      node-version: "22"
      lint-command: npm run check
      test-command: npm run test:coverage

  docker:
    uses: abhiman-erla/ci-templates/.github/workflows/docker-build.yml@590537b0bf92f11c36470b118c6e18410cce5d74 # v1.4.0
    permissions:
      contents: read
      packages: write
    with:
      image-name: ethos
      smoke-port: "3000"
      smoke-path: /health
      # /health makes no database call, but src/server.js runs the migration
      # before it listens, so the app only answers /health with a reachable
      # database. smoke-postgres starts a throwaway Postgres named db (ci/ci/ci).
      smoke-postgres: true
      smoke-env: |
        DATABASE_URL=postgres://ci:ci@db:5432/ci

  terraform:
    uses: abhiman-erla/ci-templates/.github/workflows/terraform-validate.yml@38dc8c6d2b578d7ad8ded1467c464118dc0e1dc1 # v1.3.0
    permissions:
      contents: read
    with:
      working-directory: infra/terraform
      terraform-version: 1.9.8

  ci-ok:
    if: always()
    needs: [secrets-scan, workflow-lint, node, docker, terraform]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
